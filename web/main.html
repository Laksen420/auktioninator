<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auktioninator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <div id="app-container" style="display: none;">
        <header>
            <h1>Auktioninator</h1>
            <nav class="tabs">
                <button class="tab-link active" data-tab="shopping">Shopping</button>
                <button class="tab-link" data-tab="data">Data</button>
            </nav>
        </header>

        <main>
            <div id="shopping" class="tab-content active">
                <h2>Item Prices</h2>
                <div class="controls">
                    <input type="text" id="search-bar" placeholder="Search for items...">
                    <button id="search-btn" class="icon-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </button>
                    <button id="fetch-names-btn">Fetch Item Names</button>
                </div>
                <table id="price-table">
                    <thead>
                        <tr class="sortable-header">
                            <th data-sort-by="icon">Icon</th>
                            <th data-sort-by="name">Item Name</th>
                            <th data-sort-by="id">Item ID</th>
                            <th data-sort-by="price">Minimum Price (in copper)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Price data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="data" class="tab-content">
                <h2>Data & Graphs</h2>
                <div class="chart-container">
                    <canvas id="price-distribution-chart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <div id="server-selection">
        <h2>Select Server and Realm</h2>
        <select id="server-select"></select>
        <select id="realm-select"></select>
        <button id="confirm-selection">Confirm</button>
    </div>

    <template id="details-row-template">
        <tr class="details-row">
            <td colspan="4">
                <div class="details-layout">
                    <div class="graph-tabs-vertical">
                        <button class="tab-link active" data-graph="price">Price History</button>
                        <button class="tab-link" data-graph="quantity">Quantity History</button>
                    </div>
                    <div class="graph-content">
                        <div id="price" class="graph-pane active">
                            <canvas class="price-history-chart"></canvas>
                        </div>
                        <div id="quantity" class="graph-pane">
                            <canvas class="quantity-history-chart"></canvas>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </template>

    <script src="main.js"></script>
</body>
</html>
